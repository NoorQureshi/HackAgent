name: CI

on:
  push:
  pull_request:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# Don't pile up runs on the same ref — cancel the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python files compile
        run: python3 -m py_compile tools/catalog.py tools/console/server.py tools/hooks/*.py tools/demo_svg.py bench/*.py

      - name: Shell scripts — syntax + lint (real errors only)
        run: |
          bash -n sploit install.sh bench/*.sh
          shellcheck --severity=error sploit install.sh

      - name: Skill schema is valid JSON
        run: python3 -c "import json; json.load(open('schemas/skill.schema.json'))"

      - name: Every skill passes schema validation (+ cross-references)
        run: python3 tools/catalog.py validate

      - name: Scope rule is present
        run: |
          grep -q "hard rule — scope" methodology.md || { echo "::error::methodology.md missing scope rule"; exit 1; }
          test -f skills/tradecraft/tradecraft-scope-roe/SKILL.md || { echo "::error::scope-roe skill missing"; exit 1; }

      - name: Skill counts are stamped everywhere
        run: python3 tools/catalog.py check-counts

      - name: Generated indexes are up to date
        run: |
          python3 tools/catalog.py catalog >/dev/null
          python3 tools/catalog.py coverage >/dev/null
          if ! git diff --quiet -- CATALOG.md COVERAGE.md docs/skills.json; then
            echo "::error::Generated files are stale. Run 'python3 tools/catalog.py' and commit CATALOG.md, COVERAGE.md, and docs/skills.json"
            git --no-pager diff -- CATALOG.md COVERAGE.md docs/skills.json
            exit 1
          fi
